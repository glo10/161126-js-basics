    <div>
      <button>cliquez-moi</button>
      <p>Liste des tâches</p>
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
      </ul>
    </div>
    <script>
      // 1. Sélection des éléments
      const div = document.querySelector("div");
      const input = document.querySelector("input");
      const img = document.querySelector("img");
      const btn = document.querySelector("button");
      const items = document.querySelectorAll("li");
      // Une autre méthode pour récupérer les li à partir de ul
      const ul = document.querySelector("ul");
      const listItems = ul.querySelectorAll("li"); // au lieu de partir de la racine, on part de ul
      // 2. Greffer les events + les fonctions callbacks
      //      (l'exécution suite a l'event qui a été déclenché)
      /**
       * Les events :
       *  input pour réagir dès la saisie (du live)
       *  focus : quand on est sur le champ
       *  blur : quand on quitte le champ
       *  Propres aux claviers
       *      keypress : on réagit après l'enfoncement puis le relachement d'une touche
       *      keydown : à l'enfoncement de la touche
       *      keyup : au relachement de la touche
       *  Propres à la souris
       *    click
       *    mouseenter : lorsque la souris rentre dans la zone de l'élément
       *    mouseleave : lorsqu'il sort de la zone
       */
      input.addEventListener("keypress", function (event) {
        // console.log("event", event);
        const value = event.target.value; // l'intégralité du champ
        const key = event.key; // une lettre saisie
        console.log(`Vous avez tapez ${key} et le champ a la valeur ${value}`);
      });

      img.addEventListener("mouseenter", logOnMouse);
      img.addEventListener("mouseleave", logOnMouse);
      div.addEventListener("click", function (event) {
        /**
         * Avec la délégation d'événement (on greffe l'événement sur 1 parent et il se propage sur plusieurs enfants)
         *  Avec cette technique on va utiliser la méthode closest() pour identifier la cible la plus proche
         */
        if (event.target.closest("button")) {
          console.log("On a cliqué sur le bouton", event.target.innerText);
        } else if (event.target.closest("li")) {
          console.log("On a cliqué sur une liste ", event.target.innerText);
          event.target.style.color = "green";
        }
      });

      /**
       * Utilisation d'une fonction nommée externe à .addEventListener
       *  est pertinent lorsqu'on veut utiliser le même traitement pour
       *  plusieurs événements
       */
      function logOnMouse(event) {
        if (event.type === "mouseenter") {
          console.log("Entrée");
        } else if (event.type === "mouseleave") {
          console.log("Sortie");
        }
      }
    </script>
