<div>
  <h1>Inscription</h1>
  <form autocomplete="off" method="post">
    <div class="my-3">
      <p class="form-help"></p>
      <input
        type="text"
        class="form-control"
        name="lastname"
        placeholder="Nom"
      />
    </div>
    <div class="my-3">
      <p class="form-help"></p>
      <input
        type="text"
        class="form-control"
        name="firstname"
        placeholder="Prénom"
      />
    </div>
    <div class="my-3">
      <p class="form-help"></p>
      <input
        type="email"
        class="form-control"
        name="email"
        placeholder="email"
      />
    </div>
    <div class="my-3">
      <p class="form-help"></p>
      <input
        type="password"
        class="form-control"
        name="password"
        placeholder="Confirmer le mot de passe"
      />
    </div>
    <div class="my-3">
      <p class="form-help"></p>
      <input
        type="password"
        class="form-control"
        name="confirm"
        placeholder="Confirmer le mot de passe"
      />
    </div>
    <div class="my-3">
      <p class="form-help"></p>
      <input type="number" class="form-control" name="age" placeholder="Age" />
    </div>
    <div class="my-3 align-right">
      <input
        type="submit"
        value="Valider"
        class="btn btn-success me-5"
        data-endpoint="signup"
      />
      <button class="btn btn-info">Connexion</button>
    </div>
  </form>
</div>
