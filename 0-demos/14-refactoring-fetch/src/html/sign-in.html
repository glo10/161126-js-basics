<div>
  <h1>Connexion</h1>
  <form autocomplete="off" method="post">
    <div class="my-3">
      <p class="form-help"></p>
      <input
        type="email"
        class="form-control"
        name="email"
        placeholder="email"
      />
    </div>
    <div class="my-3">
      <p class="form-help"></p>
      <input
        type="password"
        class="form-control"
        name="password"
        placeholder="mot de passe"
      />
    </div>
    <div class="my-3 align-right">
      <input type="submit" value="Valider" class="btn btn-success me-5" />
      <button class="btn btn-info">Inscription</button>
    </div>
  </form>
</div>
